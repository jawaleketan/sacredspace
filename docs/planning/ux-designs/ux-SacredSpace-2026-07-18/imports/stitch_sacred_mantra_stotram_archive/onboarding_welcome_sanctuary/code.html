<body class="font-body-md text-on-background selection:bg-primary-container selection:text-on-primary-container">
<!-- Hero Background Wrapper -->
<div class="relative h-screen w-full flex flex-col justify-end items-center overflow-hidden">
<!-- Background Image Container -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center scale-105 animate-[pulse_10s_ease-in-out_infinite] opacity-60" data-alt="A breathtaking panoramic view of the majestic Himalayas at dawn, with soft golden light hitting the snow-capped peaks. In the foreground, a subtle, ancient stone temple terrace features intricate Vedic carvings and small flickering oil lamps. The atmosphere is deeply serene, filled with a mystical haze and a palette of warm ambers, deep charcoal shadows, and sacred gold highlights. The image is hyper-realistic and captures a sense of profound spiritual awakening and timeless wisdom." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCD3EEMbdfbCd9iFqfb9QPNNE8LWkmLmYeN4ey8hhfgpTAtkXvKGaBbpbJAmuQeVojBQmJMClAZqBOi-ERrFYLAswZ16GzKjU6ZX_Q-e14EQ-WuuPHvdBViZkhmgxAGKFFq6pJx68oUXTa3rkYK8LkO99PLzyYh4si9V4PteXLfU75qtR5tcM5fUavDmEbYL0FC6ll1TSR-LxAZacEZQVNJ6PNLcYURmpVNSUMvZrfkzXB8REL_rrvTWcFvBWbL3Q7WliGtE2Z31-w')">
</div>

<div class="absolute -bottom-24 -left-24 w-96 h-96 sacred-glow z-0"></div>
<div class="absolute -top-24 -right-24 w-96 h-96 sacred-glow z-0"></div>
</div>
<!-- Navigation Shell Suppression (Transactional/Onboarding Flow) -->
<!-- Top Utility Bar (Skip Option) -->
<div class="absolute top-0 left-0 w-full px-margin-mobile md:px-margin-desktop py-8 z-50 flex justify-end">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary serene-transition tracking-widest uppercase">
                Skip
            </button>
</div>
<!-- Main Content Canvas -->
<main class="relative z-30 w-full max-w-container-max px-margin-mobile md:px-margin-desktop pb-24 md:pb-32 text-center flex flex-col items-center">
<!-- Branding / Logo Area -->
<div class="mb-stack-lg animate-fade-in-up">
<div class="flex items-center justify-center mb-base">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">
                        temple_hindu
                    </span>
</div>
<h1 class="font-headline-display text-headline-lg-mobile md:text-headline-display text-on-surface tracking-tight">
                    Welcome to SacredSpace
                </h1>
</div>
<!-- Descriptive Text -->
<div class="max-w-2xl mb-stack-lg opacity-0 animate-[fadeIn_1s_ease-out_0.5s_forwards]">
<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed">
                    Your digital sanctuary for Vedic chants and ancient wisdom. 
                    Reclaim your inner silence through a curated journey of mindfulness and ritual.
                </p>
</div>
<!-- Primary Action -->
<div class="flex flex-col items-center gap-gutter opacity-0 animate-[fadeIn_1s_ease-out_1s_forwards]">
<button class="relative group px-12 py-5 bg-primary-container text-on-primary-container rounded-full font-label-md text-label-md serene-transition hover:scale-105 active:scale-95 shadow-xl">
<span class="relative z-10">Begin Journey</span>
<!-- Sacred Glow Effect -->
<div class="absolute inset-0 rounded-full bg-primary opacity-0 group-hover:opacity-20 blur-xl serene-transition"></div>
</button>
<!-- Secondary Micro-text -->
<div class="flex items-center gap-2 text-outline font-label-sm text-label-sm uppercase tracking-[0.2em]">
<span class="w-8 h-[1px] bg-outline/20"></span>
                    Step into the silence
                    <span class="w-8 h-[1px] bg-outline/20"></span>
</div>
</div>
</main>
<!-- Decorative Footer Element -->
<div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary/30 to-transparent"></div>
</div>
<!-- Micro-Interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const button = document.querySelector('button');
            button.addEventListener('mouseenter', () => {
                // Potential for haptic feedback or sound trigger here
            });
            
            // Background subtle parallax effect
            window.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) / 100;
                const moveY = (e.clientY - window.innerHeight / 2) / 100;
                const bg = document.querySelector('[data-alt]');
                if (bg) {
                    bg.style.transform = `scale(1.05) translate(${moveX}px, ${moveY}px)`;
                }
            });
        });
    </script>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeIn 1s ease-out forwards;
        }
    </style>
