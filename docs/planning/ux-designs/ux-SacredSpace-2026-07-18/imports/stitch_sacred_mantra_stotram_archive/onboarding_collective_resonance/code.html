<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .sacred-glow {
            box-shadow: 0 0 40px 10px rgba(212, 168, 75, 0.15);
        }
        .heart-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.8; }
        }
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .resonance-ring {
            border: 1px solid rgba(212, 168, 75, 0.2);
            border-radius: 50%;
            position: absolute;
            animation: expand 4s linear infinite;
        }
        @keyframes expand {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }
    </style>

<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const heartIcon = document.querySelector('.heart-pulse');
            const nextButton = document.querySelector('button.bg-gold');

            // Subtle interaction for the heart when "Next" is hovered to guide the eye
            nextButton.addEventListener('mouseenter', () => {
                heartIcon.style.animationDuration = '0.8s';
                heartIcon.style.color = '#ff4d4d'; // Brighter red on hover
            });

            nextButton.addEventListener('mouseleave', () => {
                heartIcon.style.animationDuration = '2s';
                heartIcon.style.color = ''; 
            });

            // Prevent scroll on onboarding
            document.body.style.overflow = 'hidden';
        });
    </script>
