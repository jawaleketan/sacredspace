        }

<!-- Content Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Micro-interaction: Wave height variation
            const bars = document.querySelectorAll('.wave-bar');
            setInterval(() => {
                bars.forEach(bar => {
                    const randomHeight = Math.floor(Math.random() * 50) + 15;
                    bar.style.height = `${randomHeight}px`;
                });
            }, 800);

            // Subtle mouse parallax for the sacred glow
            document.addEventListener('mousemove', (e) => {
                const glows = document.querySelectorAll('.sacred-glow');
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                
                glows.forEach((glow, index) => {
                    const factor = (index + 1) * 20;
                    glow.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
                });
            });
        });
    </script>
