<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — SacredSpace</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: #faf8f6;
      color: #1c1b1a;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.8;
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #494845;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.75rem;
      background: #d4a84b;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
    }
    .btn:hover { background: #f59e3b; }
    .btn:focus-visible {
      outline: 2px solid #d4a84b;
      outline-offset: 2px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1b1a; color: #e3e0dc; }
      p { color: #cbc8c3; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">🕉️</div>
    <h1>You're offline</h1>
    <p>SacredSpace needs an internet connection to load mantras and stotras. Please check your connection and try again.</p>
    <button class="btn" onclick="window.location.reload()" aria-label="Retry loading the page">
      Try again
    </button>
  </div>
</body>
</html>
